name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No third-party packages needed: pynput and pyserial are only imported when used.

      - name: Receiver and bridge mapping tests
        working-directory: receiver
        run: python -m unittest -v test_receiver test_xbox_bridge

      - name: Switch app C mapping vs Python mapping
        run: python switch_app/tests/crosscheck.py 5000
